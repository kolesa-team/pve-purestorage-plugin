name: Lint
run-name: Lint ${{ inputs.enable-perl-lint && 'Perl' || '' }} ${{ inputs.enable-markdown-lint && 'Markdown' || '' }}

on:
  workflow_call:
    inputs:
      enable-perl-lint:
        description: 'Enable Perl linting'
        required: false
        type: boolean
        default: false
      enable-markdown-lint:
        description: 'Enable Markdown linting'
        required: false
        type: boolean
        default: false
      perl-files:
        description: 'List of changed Perl files'
        required: false
        type: string
        default: ''
      markdown-files:
        description: 'List of changed Markdown files'
        required: false
        type: string
        default: ''

jobs:
  perl-lint:
    name: Perl Lint
    if: ${{ inputs.enable-perl-lint == true }}
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.34'
        install-cpanm: true

    - name: Install linting tools
      run: |
        cpanm --notest Perl::Critic
        sudo apt-get update
        sudo apt-get install -y perltidy || true

    - name: Check Perl syntax
      if: inputs.perl-files != ''
      run: |
        echo "Checking Perl syntax..."
        changed_files="${{ inputs.perl-files }}"
        for file in $changed_files; do
          if [[ "$file" == *.pm ]] || [[ "$file" == *.pl ]]; then
            echo "Checking $file..."
            # Check syntax, ignore missing PVE dependencies
            output=$(perl -c "$file" 2>&1)
            exit_code=$?

            # Check if this is a PVE dependency error (expected and OK)
            if echo "$output" | grep -q "Can't locate PVE/" && echo "$output" | grep -q "BEGIN failed--compilation aborted"; then
              # Only PVE dependency errors - this is OK
              echo "$file: OK (PVE dependencies not available, skipped)"
              continue
            fi

            # If we got here, either success or real error
            if [ $exit_code -ne 0 ]; then
              echo "::error file=$file::Perl compilation error"
              echo "$output"
              exit 1
            fi

            echo "$file: syntax OK"
          fi
        done

    - name: Check code formatting with perltidy
      if: inputs.perl-files != ''
      run: |
        echo "Checking code formatting..."
        changed_files="${{ inputs.perl-files }}"
        for file in $changed_files; do
          if [[ "$file" == *.pm ]] || [[ "$file" == *.pl ]]; then
            echo "Checking formatting: $file"
            if command -v perltidy >/dev/null 2>&1; then
              formatted_file="${file}.formatted"
              perltidy "$file" -o "$formatted_file" 2>/dev/null || true
              if [ -f "$formatted_file" ]; then
                if ! diff -q "$file" "$formatted_file" >/dev/null 2>&1; then
                  echo "::error file=$file::File is not properly formatted. Run 'perltidy $file' to fix."
                  rm -f "$formatted_file"
                  exit 1
                fi
                rm -f "$formatted_file"
              fi
            fi
          fi
        done
        find . -name '*.formatted' -delete 2>/dev/null || true

    - name: Run Perl::Critic (optional)
      if: inputs.perl-files != ''
      continue-on-error: true
      run: |
        echo "Running Perl::Critic static analysis..."
        if command -v perlcritic >/dev/null 2>&1; then
          changed_files="${{ inputs.perl-files }}"
          for file in $changed_files; do
            if [[ "$file" == *.pm ]]; then
              echo "Analyzing: $file"
              perlcritic --quiet "$file" || true
            fi
          done
        else
          echo "Perl::Critic not available, skipping..."
        fi

  markdown-lint:
    name: Markdown Lint
    if: ${{ inputs.enable-markdown-lint == true }}
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install markdownlint
      run: |
        npm install -g markdownlint-cli2 || true

    - name: Lint Markdown files
      if: inputs.markdown-files != ''
      run: |
        echo "Linting Markdown files..."
        changed_files="${{ inputs.markdown-files }}"
        if command -v markdownlint-cli2 >/dev/null 2>&1; then
          for file in $changed_files; do
            if [[ "$file" == *.md ]]; then
              echo "Linting: $file"
              markdownlint-cli2 "$file" "#node_modules" "#.git" || {
                echo "::error file=$file::Markdown linting failed"
                exit 1
              }
            fi
          done
        elif command -v markdownlint >/dev/null 2>&1; then
          for file in $changed_files; do
            if [[ "$file" == *.md ]]; then
              echo "Linting: $file"
              markdownlint "$file" || {
                echo "::error file=$file::Markdown linting failed"
                exit 1
              }
            fi
          done
        else
          echo "Markdown linter not available, skipping..."
        fi
