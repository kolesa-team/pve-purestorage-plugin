name: Tests
run-name: Tests - ${{ github.ref_name }}

on:
  workflow_call:

jobs:
  test:
    name: Run tests (Perl ${{ matrix.perl }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # the Perl of PVE 8 and of PVE 9
        perl: ['5.36', '5.40']
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7 # v1.44.2
      with:
        perl-version: ${{ matrix.perl }}

    - name: Install cpanm
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus

    - name: Install Perl dependencies
      run: |
        cpanm --notest Test::More JSON JSON::XS LWP::UserAgent HTTP::Message URI

    - name: Run tests
      run: |
        chmod +x tests/run_tests.sh
        ./tests/run_tests.sh
